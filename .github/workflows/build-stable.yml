name: Package Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override, such as x.x.x. Leave empty to use Directory.Build.props.
        required: false
        type: string
  push:
    branches:
      - stable
      - win7

concurrency:
  group: package-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_BACKTRACE: "1"

jobs:
  validate-branch:
    name: Validate build branch
    runs-on: ubuntu-22.04
    steps:
      - name: Require stable or win7 branch
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/heads/stable|refs/heads/win7)
              echo "Build branch: ${{ github.ref_name }}"
              ;;
            *)
              echo "::error::Package build only runs on stable or win7."
              exit 1
              ;;
          esac

  prepare:
    name: Prepare build metadata
    needs: validate-branch
    runs-on: ubuntu-22.04
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      app_display_name: ${{ steps.meta.outputs.app_display_name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read app metadata
        id: names
        shell: bash
        run: |
          set -euo pipefail
          app_name="$(sed -n 's:.*<AppName>\(.*\)</AppName>.*:\1:p' Directory.Build.props)"
          app_display_name="$(sed -n 's:.*<AppDisplayName>\(.*\)</AppDisplayName>.*:\1:p' Directory.Build.props)"
          test -n "${app_name}"
          printf 'app_name=%s\n' "${app_name}" >> "$GITHUB_OUTPUT"
          printf 'app_display_name=%s\n' "${app_display_name:-$app_name}" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "${version}" ]; then
            version="$(sed -n 's:.*<AppVersion>\(.*\)</AppVersion>.*:\1:p' Directory.Build.props)"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use major.minor.patch, such as x.x.x."
            exit 1
          fi
          printf 'version=%s\ntag=v%s\n' "${version}" "${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Export build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          channel="${{ github.ref_name }}"
          {
            echo "app_name=${{ steps.names.outputs.app_name }}"
            echo "app_display_name=${{ steps.names.outputs.app_display_name }}"
            echo "version=${{ steps.ver.outputs.version }}"
            echo "tag=${{ steps.ver.outputs.tag }}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Build Metadata"
            echo ""
            echo "- App: `${{ steps.names.outputs.app_display_name }}`"
            echo "- Channel: `${channel}`"
            echo "- Version: `${{ steps.ver.outputs.version }}`"
            echo "- Tag: `${{ steps.ver.outputs.tag }}`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build / ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            platform: win-x64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.platform }}-
            nuget-${{ runner.os }}-

      - name: Cache Cargo packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "inno-setup-7"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_1/innosetup-7.0.1-beta-x64.exe" `
            -OutFile $installer
          Start-Process `
            -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$installDir") `
            -Wait `
            -NoNewWindow

          $iscc = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 7 compiler ISCC.exe was not found"
          }
          $installDir >> $env:GITHUB_PATH
          $compilerHelp = & $iscc /? 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          Write-Host $compilerHelp
          if ($compilerHelp -notmatch "Inno Setup 7") {
            throw "Inno Setup compiler is not version 7"
          }

      - name: Build Windows release package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prebuild.py --platform ${{ matrix.platform }}
          python scripts/build.py --platform ${{ matrix.platform }} --version ${{ needs.prepare.outputs.version }} --pack all

      - name: Package installer as zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path build/packages -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Installer exe was not found in build/packages"
          }
          $zipPath = Join-Path "build/packages" "$($installer.BaseName).zip"
          if (Test-Path $zipPath) {
            Remove-Item -Force $zipPath
          }
          Compress-Archive -Path $installer.FullName -DestinationPath $zipPath
          Write-Host "Installer zip: $zipPath"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: stelliberty-portable-${{ needs.prepare.outputs.channel }}-${{ matrix.platform }}
          path: build/*.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: stelliberty-installer-${{ needs.prepare.outputs.channel }}-${{ matrix.platform }}
          path: build/packages/*.zip
          if-no-files-found: error
