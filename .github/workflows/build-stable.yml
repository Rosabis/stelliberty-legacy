name: Stable Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version, such as x.x.x
        required: true
        type: string
  push:
    branches:
      - stable
    paths:
      - Directory.Build.props

concurrency:
  group: stable-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_BACKTRACE: "1"

jobs:
  validate-branch:
    name: Validate stable branch
    runs-on: ubuntu-22.04
    steps:
      - name: Require stable branch
        shell: bash
        run: test "${{ github.ref }}" = 'refs/heads/stable'

  detect-version-change:
    name: Detect version change
    needs: validate-branch
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect AppVersion change
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            echo 'Manual trigger: build enabled.'
          elif git diff --unified=0 "${{ github.event.before }}" "${{ github.sha }}" -- Directory.Build.props | grep -Eq '^[+-].*<AppVersion>'; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            echo 'AppVersion changed: build enabled.'
          else
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo 'AppVersion did not change: build skipped.'
          fi

  prepare:
    name: Prepare build metadata
    needs: detect-version-change
    if: needs.detect-version-change.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    outputs:
      app_name: ${{ steps.meta.outputs.app_name }}
      app_display_name: ${{ steps.meta.outputs.app_display_name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read app metadata
        id: names
        shell: bash
        run: |
          set -euo pipefail
          app_name="$(sed -n 's:.*<AppName>\(.*\)</AppName>.*:\1:p' Directory.Build.props)"
          app_display_name="$(sed -n 's:.*<AppDisplayName>\(.*\)</AppDisplayName>.*:\1:p' Directory.Build.props)"
          test -n "${app_name}"
          printf 'app_name=%s\n' "${app_name}" >> "$GITHUB_OUTPUT"
          printf 'app_display_name=%s\n' "${app_display_name:-$app_name}" >> "$GITHUB_OUTPUT"

      - name: Read stable version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="$(sed -n 's:.*<AppVersion>\(.*\)</AppVersion>.*:\1:p' Directory.Build.props)"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use major.minor.patch, such as x.x.x."
            exit 1
          fi
          printf 'version=%s\ntag=v%s\n' "${version}" "${version}" >> "$GITHUB_OUTPUT"
          echo "Stable version: ${version}"

      - name: Export build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "app_name=${{ steps.names.outputs.app_name }}"
            echo "app_display_name=${{ steps.names.outputs.app_display_name }}"
            echo "version=${{ steps.ver.outputs.version }}"
            echo "tag=${{ steps.ver.outputs.tag }}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Build Metadata"
            echo ""
            echo "- App: `${{ steps.names.outputs.app_display_name }}`"
            echo "- Channel: `stable`"
            echo "- Version: `${{ steps.ver.outputs.version }}`"
            echo "- Tag: `${{ steps.ver.outputs.tag }}`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build / ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            platform: win-x64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.platform }}-
            nuget-${{ runner.os }}-

      - name: Cache Cargo packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = Join-Path $env:RUNNER_TEMP "inno-setup-7"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_1/innosetup-7.0.1-beta-x64.exe" `
            -OutFile $installer
          Start-Process `
            -FilePath $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$installDir") `
            -Wait `
            -NoNewWindow

          $iscc = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 7 compiler ISCC.exe was not found"
          }
          $installDir >> $env:GITHUB_PATH
          $compilerHelp = & $iscc /? 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          Write-Host $compilerHelp
          if ($compilerHelp -notmatch "Inno Setup 7") {
            throw "Inno Setup compiler is not version 7"
          }

      - name: Build Windows release package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prebuild.py --platform ${{ matrix.platform }}
          python scripts/build.py --platform ${{ matrix.platform }} --version ${{ needs.prepare.outputs.version }} --pack all

      - name: Package installer as zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path build/packages -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Installer exe was not found in build/packages"
          }
          $zipPath = Join-Path "build/packages" "$($installer.BaseName).zip"
          if (Test-Path $zipPath) {
            Remove-Item -Force $zipPath
          }
          Compress-Archive -Path $installer.FullName -DestinationPath $zipPath
          Write-Host "Installer zip: $zipPath"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: stelliberty-portable-${{ matrix.platform }}
          path: build/*.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: stelliberty-installer-${{ matrix.platform }}
          path: build/packages/*.zip
          if-no-files-found: error
